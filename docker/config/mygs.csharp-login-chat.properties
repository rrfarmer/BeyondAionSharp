database.url = jdbc:mysql://host.docker.internal:3306/aion_gs?serverTimezone=${gameserver.timezone}&characterEncoding=UTF-8
database.user = root
database.password = aion

# Mixed-mode local validation: Java game server in Docker, C# login and C# chat servers on the host.
gameserver.network.client.connect_address = 127.0.0.1:7777
gameserver.network.login.address = host.docker.internal:9014
gameserver.network.login.gsid = 1
gameserver.network.login.password = 1234
gameserver.network.login.min_accesslevel = 0
gameserver.network.login.max_players = 100
gameserver.chatserver.enable = true
gameserver.network.chat.address = host.docker.internal:9021
gameserver.network.chat.password = 1234
